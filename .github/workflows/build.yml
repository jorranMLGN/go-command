name: Build and Sign macOS App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-sign:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build for macOS
        run: |
          GOOS=darwin GOARCH=amd64 go build -o go-command-mac
          GOOS=darwin GOARCH=arm64 go build -o go-command-mac-arm64

      # For free GitHub accounts, you can't do notarization but
      # can still build and create artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: macos-binaries
          path: |
            go-command-mac
            go-command-mac-arm64
