name: Build macOS Binaries

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Manually trigger workflow from the Actions tab
  workflow_dispatch:
  # Build on new tags (releases)
    push:
      tags:
        - 'v*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Build for Intel Mac
        run: GOOS=darwin GOARCH=amd64 go build -v -o go-command-mac

      - name: Build for Apple Silicon Mac
        run: GOOS=darwin GOARCH=arm64 go build -v -o go-command-mac-arm64

      - name: Create universal binary (works on both Intel and Apple Silicon)
        run: lipo -create -output go-command-mac-universal go-command-mac go-command-mac-arm64

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v3
        with:
          name: macos-binaries
          path: |
            go-command-mac
            go-command-mac-arm64
            go-command-mac-universal
          retention-days: 7

      # Create release when a tag is pushed
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            go-command-mac
            go-command-mac-arm64
            go-command-mac-universal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}